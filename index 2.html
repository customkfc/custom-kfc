<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUSTOM KFC - Đăng ký đội</title>
<style>
:root{--red:#e53935;--bg:#0b0b0e;--panel:#15151b;--muted:#9b9ba6;--line:#292932}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f5f7;font-family:Arial,Helvetica,sans-serif}
main{width:min(920px,100%);margin:auto;padding:22px 16px 50px}
header{text-align:center;margin-bottom:24px}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;color:#fff}
.logo span{color:var(--red)}
header p{color:var(--muted);margin:8px 0 0}
h2{font-size:17px;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0}
.time-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
button{font:inherit;cursor:pointer}
.time-btn,.table-btn{border:1px solid var(--line);background:#202027;color:#fff;border-radius:11px;padding:13px 8px;font-weight:800}
.time-btn.active,.table-btn.active{border-color:var(--red);background:#3a191b;box-shadow:0 0 0 1px var(--red) inset}
.table-area{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.table-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.table-btn{font-size:13px;padding:12px 5px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
form{display:grid;gap:11px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0f0f14;color:white;font:inherit}
label{font-size:13px;color:#d7d7df;display:block;margin-bottom:6px}
.primary{background:var(--red);border:0;color:white;border-radius:10px;padding:13px;font-weight:800}
.primary:disabled{opacity:.45;cursor:not-allowed}
.selection{font-size:13px;color:#ffb7b5;margin:0 0 12px}
.list{display:grid;gap:9px}
.team{display:flex;align-items:center;gap:12px;background:#202027;border:1px solid var(--line);border-radius:11px;padding:10px}
.team img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#333}
.team strong{display:block}
.team small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.empty{border:1px dashed #393943;color:var(--muted);padding:18px;text-align:center;border-radius:10px;font-size:13px}
.count{font-size:12px;color:var(--muted);margin:0 0 10px}
@media(max-width:480px){.time-grid{grid-template-columns:repeat(2,1fr)}.table-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">CUSTOM <span>KFC</span></div>
  <p>Đăng ký đội theo khung giờ và bảng đấu</p>
</header>

<section class="panel">
  <h2>1. CHỌN KHUNG GIỜ</h2>
  <div class="time-grid" id="timeGrid"></div>
  <div class="table-area">
    <h2>2. CHỌN BẢNG</h2>
    <div class="table-grid" id="tableGrid"></div>
    <p class="hint">Chọn khung giờ trước, sau đó chọn bảng ở ngay bên dưới.</p>
  </div>
</section>

<section class="panel">
  <h2>3. ĐĂNG KÝ ĐỘI</h2>
  <p class="selection" id="selectionText">Vui lòng chọn khung giờ và bảng trước khi đăng ký.</p>
  <form id="regForm">
    <div><label for="teamName">Tên đội</label><input id="teamName" maxlength="40" required placeholder="Nhập tên đội"></div>
    <div><label for="captainId">ID đội trưởng Free Fire</label><input id="captainId" maxlength="30" required placeholder="Nhập ID đội trưởng"></div>
    <div><label for="teamLogo">Logo đội (không bắt buộc)</label><input id="teamLogo" type="file" accept="image/*"></div>
    <button class="primary" id="submitBtn" type="submit" disabled>ĐĂNG KÝ ĐỘI</button>
  </form>
</section>

<section class="panel">
  <h2 id="listTitle">4. DANH SÁCH ĐỘI</h2>
  <p class="count" id="teamCount">0 đội</p>
  <div class="list" id="teamList"><div class="empty">Chọn khung giờ và bảng để xem danh sách đội.</div></div>
</section>
</main>
<script>
const TIMES=["13:00","15:00","18:00","20:00","22:00"];
const TABLES=["Bảng 1","Bảng 2","Bảng 3","Bảng 4"];
let selectedTime=null, selectedTable=null;
const $=id=>document.getElementById(id);
const dayKey=()=>new Date().toLocaleDateString("en-CA");
const storageKey=()=>`customKFCRegistrations_${dayKey()}`;
function getData(){try{return JSON.parse(localStorage.getItem(storageKey())||"{}")}catch{return {}}}
function saveData(data){localStorage.setItem(storageKey(),JSON.stringify(data))}
function slotKey(){return `${selectedTime}|${selectedTable}`}
function renderTimes(){
  $("timeGrid").innerHTML=TIMES.map(t=>`<button type="button" class="time-btn ${selectedTime===t?"active":""}" data-time="${t}">${t}</button>`).join("");
  $("timeGrid").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{selectedTime=b.dataset.time;selectedTable=null;renderAll()}));
}
function renderTables(){
  $("tableGrid").innerHTML=TABLES.map(t=>`<button type="button" class="table-btn ${selectedTable===t?"active":""}" data-table="${t}" ${!selectedTime?"disabled":""}>${t}</button>`).join("");
  $("tableGrid").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{selectedTable=b.dataset.table;renderAll()}));
}
function renderList(){
  if(!selectedTime||!selectedTable){
    $("listTitle").textContent="4. DANH SÁCH ĐỘI";
    $("teamCount").textContent="—";
    $("teamList").innerHTML='<div class="empty">Chọn khung giờ và bảng để xem danh sách đội.</div>';
    return;
  }
  const data=getData(), teams=data[slotKey()]||[];
  $("listTitle").textContent=`DANH SÁCH ${selectedTime} · ${selectedTable.toUpperCase()}`;
  $("teamCount").textContent=`${teams.length} đội`;
  $("teamList").innerHTML=teams.length?teams.map(team=>`<div class="team">${team.logo?`<img src="${team.logo}" alt="Logo đội">`:'<div class="team" style="width:48px;height:48px;justify-content:center;padding:0">—</div>'}<div><strong>${escapeHtml(team.name)}</strong><small>ID đội trưởng: ${escapeHtml(team.captainId)}</small></div></div>`).join(""):'<div class="empty">Chưa có đội nào đăng ký ở mục này.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderAll(){
  renderTimes();renderTables();
  $("selectionText").textContent=selectedTime&&selectedTable?`Đang chọn: ${selectedTime} · ${selectedTable}`:selectedTime?`Đã chọn ${selectedTime}. Hãy chọn bảng ở bên dưới.`:"Vui lòng chọn khung giờ và bảng trước khi đăng ký.";
  $("submitBtn").disabled=!(selectedTime&&selectedTable);
  renderList();
}
$("regForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!selectedTime||!selectedTable)return;
  const name=$("teamName").value.trim(),captainId=$("captainId").value.trim(),file=$("teamLogo").files[0];
  if(!name||!captainId)return;
  if(file&&file.size>1.5*1024*1024){alert("Logo tối đa 1,5 MB.");return}
  const data=getData();
  const all=Object.values(data).flat();
  if(all.some(t=>t.captainId.toLowerCase()===captainId.toLowerCase())){alert("ID đội trưởng này đã đăng ký hôm nay.");return}
  let logo="";
  if(file){logo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
  data[slotKey()]??=[];
  data[slotKey()].push({name,captainId,logo});
  try{saveData(data)}catch{alert("Không lưu được. Logo có thể quá lớn, hãy chọn ảnh nhỏ hơn.");return}
  $("regForm").reset();renderAll();alert("Đăng ký thành công!");
});
function resetAtMidnight(){
  const now=new Date(),next=new Date(now);next.setHours(24,0,1,0);
  setTimeout(()=>{localStorage.removeItem(storageKey());selectedTime=null;selectedTable=null;renderAll();resetAtMidnight()},next-now);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){renderAll()}});
renderAll();resetAtMidnight();
</script>
</body>
</html>
